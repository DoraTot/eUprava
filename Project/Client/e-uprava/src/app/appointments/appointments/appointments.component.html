<div class="container my-4">

  <!-- Page Title -->
  <h2 class="mb-3">Appointments</h2>

  <!-- Table -->
  <div class="table-responsive mb-4">
    <table class="table table-striped table-bordered align-middle">
      <thead class="table-dark">
      <tr>
        <th>Child</th>
        <th *ngIf="role != 'Patient/Parent'">Parent ID</th>
        <th *ngIf="role != 'Doctor'">Doctor ID</th>
        <th>Date & Time</th>
        <th>Notes</th>
        <th *ngIf="role != 'Educator'"></th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let a of appointments">
        <td>{{ a.child_name }}</td>
        <td *ngIf="role != 'Patient/Parent'">{{ a.parent_id }}</td>
        <td *ngIf="role != 'Doctor'">{{ a.doctor_id }}</td>
        <td>{{ a.date_time | date:'short' }}</td>
        <td>{{ a.notes }}</td>
        <td *ngIf="role === 'Doctor'">
          <button
            class="btn btn-sm btn-success"
            (click)="openModal2(a)"
            *ngIf="role === 'Doctor' && !a.justified">
            Approve
          </button>
        </td>
        <td *ngIf="role === 'Patient/Parent'">
          <button
            class="btn btn-sm btn-danger"
            (click)="cancelAppointment(a.id)"
            *ngIf="isFutureDate(a.date_time) && !a.justified">
            Cancel
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Button to open modal -->
  <button  *ngIf="role === 'Patient/Parent'" type="button" class="btn btn-primary mb-3" (click)="openModal()">
    Add Appointment
  </button>

  <!-- Modal -->
  <div #appointmentModal class="modal fade" tabindex="-1" style="display:none;">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Add Appointment</h5>
          <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
        </div>

        <div class="modal-body">
          <form [formGroup]="appointmentForm" (ngSubmit)="addAppointment()">

            <div class="mb-3">
              <label class="form-label">Child Name</label>
              <input type="text" class="form-control" formControlName="child_name" placeholder="Child Name">
            </div>

            <div class="mb-3">
              <label class="form-label">Doctor</label>
<!--              <input type="number" class="form-control" formControlName="doctorID">-->
              <select class="form-control" formControlName="doctor_id">
                <option *ngFor="let doctor of doctors" [value]="doctor.user_id">
                  {{ doctor.name }} ({{ doctor.email }})
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Date & Time</label>
              <input type="datetime-local"
                     class="form-control"
                     formControlName="date_time"
                     [min]="minDateTime">
            </div>


            <div class="mb-3">
              <label class="form-label">Notes</label>
              <input type="text" class="form-control" formControlName="notes">
            </div>

            <div class="text-end">
              <button type="button" class="btn btn-secondary me-2" (click)="closeModal()">Close</button>
              <button type="submit" class="btn btn-primary" >Add</button>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>


  <div #appointmentModal2 class="modal fade" tabindex="-1" style="display:none;">
    <div class="modal-dialog">
      <div class="modal-content">


        <div class="modal-body">
          <form [formGroup]="medForm" (ngSubmit)="approve()">

            <div class="mb-3">
              <label class="form-label">Notes</label>
              <input type="text" class="form-control" formControlName="reason">
            </div>

            <div class="text-end">
              <button type="button" class="btn btn-secondary me-2" (click)="closeModal2()">Cancel</button>
              <button type="submit" class="btn btn-primary">Approve</button>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>



</div>
