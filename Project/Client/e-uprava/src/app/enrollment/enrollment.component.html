<div class="container my-4">




  <h3>Children</h3>
  <table class="table table-striped" style="text-align: center;">
    <thead>
    <tr>
      <th>Name</th>
      <th>Enrollment Status</th>
      <th>Systematic Exam Passed</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let child of children" [ngClass]="{'border border-danger': child.enrolled === 'EXAM_EXPIRED', 'p-2': child.enrolled === 'EXAM_EXPIRED'}">
      <td>{{ child.name }}</td>
      <td>{{ child.enrolled }}</td>
      <td>
        <span *ngIf="child.exam_done" class="text-success">✔</span>
        <span *ngIf="!child.exam_done" class="text-danger">✖</span>

      </td>
      <td class="text-danger mt-1" >
        <div  *ngIf="child.enrolled === 'EXAM_EXPIRED'">
          ⚠️ Systematic exam expired – action required. <br> Child cannot attend until the systematic exam is done.
        </div>
<!--        <button *ngIf="role === 'Patient/Parent' && child.enrolled != 'ENROLLED'" class="btn btn-sm btn-success" (click)="enrollChild(child.name)">-->
<!--          Enroll-->
<!--        </button>-->
      </td>
    </tr>
    </tbody>
  </table>

<br><br><br>

  <button *ngIf="role === 'Patient/Parent'" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addChildModal">
    Add Child
  </button>
  <div class="modal fade" id="addChildModal" #addChildModal tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Add Child</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <form [formGroup]="enrollmentForm" (ngSubmit)="addChild()">
            <div class="mb-3">
              <label for="childName" class="form-label">Child Name</label>
              <input id="childName" type="text" class="form-control" formControlName="name" placeholder="Enter child's name">
            </div>
            <div class="text-end">
              <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-primary" [disabled]="enrollmentForm.invalid">Add</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
